# ==============================================================================
# Tiramisu Docker Publishing Pipeline
# Automatically publishes Docker images to GHCR on main branch push
# No Docker Hub credentials required - GHCR only
# ==============================================================================

name: Docker Publish

on:
  push:
    branches: [ main, merge-upstream-test ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# Grant permissions to GitHub Token for package management
permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Registry settings - GHCR only
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: tiramisu_v2

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/davi-f-ribeiro/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}

      - name: Generate build summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published to:" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Container Registry:** \`docker pull ghcr.io/davi-f-ribeiro/tiramisu_v2:latest\`" >> $GITHUB_STEP_SUMMARY
